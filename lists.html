<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>
    <h1>list</h1>
    <h2>ordered list</h2>
    <h1>list of countries</h1>
    <ol>
        <li></li>
        <li></li>
        <li></li>
        <li>Burundi</li>
        <li>Somalia</li>
    </ol>
    <h1>unorderd list</h1>
    <h2>list of fruits</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Grape</li>
        <li>Strawberry</li>
    </ul>
    <dl>
        <dt>Apple</dt>
        <dd>A round fruit with red skin.</dd>
        <dt>Banana</dt>
    </dl>
</body>
</html>
